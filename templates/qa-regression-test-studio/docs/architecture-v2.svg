<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810">
  <defs>
    <filter id="ds" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e293b" flood-opacity=".08"/>
    </filter>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
    <marker id="ahB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    </marker>
    <marker id="ahG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#10b981" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1440" height="810" rx="0" fill="#f8fafc"/>

  <!-- title block -->
  <text x="60" y="52" font-family="Segoe UI,system-ui,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Regression Test Studio</text>
  <text x="60" y="78" font-family="Segoe UI,system-ui,sans-serif" font-size="14" fill="#64748b">No-code browser regression testing · Fabric App + Foundry Agent + Playwright</text>

  <!-- ════════════════ ROW 1: User + SPA + Auth ════════════════ -->

  <!-- user -->
  <rect x="60" y="120" width="200" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#ds)"/>
  <circle cx="160" cy="155" r="20" fill="#dbeafe"/>
  <text x="154" y="160" font-family="Segoe UI,system-ui,sans-serif" font-size="18" fill="#3b82f6">👤</text>
  <text x="160" y="198" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="600" fill="#1e293b">Business analyst</text>

  <!-- SPA -->
  <rect x="340" y="120" width="380" height="100" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="360" y="155" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#3b82f6" letter-spacing="1">FABRIC APP</text>
  <text x="360" y="180" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1e293b">Regression Test Studio SPA</text>

  <!-- Entra -->
  <rect x="800" y="120" width="220" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="820" y="155" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">IDENTITY</text>
  <text x="820" y="180" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">Microsoft Entra ID</text>

  <!-- secrets note -->
  <rect x="1100" y="120" width="280" height="100" rx="16" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1120" y="155" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#a16207" letter-spacing="1">SECURITY</text>
  <text x="1120" y="180" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">Runtime credentials</text>

  <!-- ════════════════ ROW 2: Data layer ════════════════ -->

  <!-- Rayfin API -->
  <rect x="60" y="310" width="200" height="100" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="80" y="345" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#059669" letter-spacing="1">DATA API</text>
  <text x="80" y="372" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">Rayfin backend</text>

  <!-- SQL DB -->
  <rect x="340" y="300" width="380" height="100" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="360" y="335" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#059669" letter-spacing="1">FABRIC SQL DATABASE</text>
  <text x="360" y="362" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">9 Rayfin entities</text>

  <!-- Run orchestration -->
  <rect x="800" y="310" width="220" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="820" y="345" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">ORCHESTRATION</text>
  <text x="820" y="372" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">Test runner</text>

  <!-- CSV export -->
  <rect x="1100" y="310" width="280" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1120" y="345" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">REPORTING</text>
  <text x="1120" y="372" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">CSV / failure reports</text>

  <!-- ════════════════ ROW 3: Foundry execution ════════════════ -->

  <!-- Agent -->
  <rect x="60" y="480" width="260" height="100" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="80" y="515" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="1">FOUNDRY AGENT</text>
  <text x="80" y="542" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">regression-test-agent</text>

  <!-- Toolbox -->
  <rect x="400" y="480" width="300" height="100" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="420" y="515" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="1">MCP TOOLBOX</text>
  <text x="420" y="542" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">Browser Automation v2</text>

  <!-- Playwright -->
  <rect x="780" y="480" width="240" height="100" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#ds)"/>
  <text x="800" y="515" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="1">BROWSER ENGINE</text>
  <text x="800" y="542" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">Playwright workspace</text>

  <!-- Apps under test -->
  <rect x="1100" y="480" width="280" height="100" rx="16" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#ds)"/>
  <text x="1120" y="515" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#e11d48" letter-spacing="1">APPLICATIONS UNDER TEST</text>
  <text x="1120" y="542" font-family="Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e293b">4 business applications</text>

  <!-- ════════════════ ROW 4: Self-healing callout ════════════════ -->

  <rect x="60" y="640" width="1320" height="55" rx="16" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#ds)"/>
  <text x="90" y="666" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#9333ea" letter-spacing="1">SELF-HEALING LOOP</text>
  <text x="90" y="685" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#581c87">Plain-language targets → agent resolves locators → stored on step → replayed next run → re-resolved when broken → healed flag set</text>

  <!-- ════════════════ ROW 5: Optional scheduling ════════════════ -->

  <rect x="60" y="720" width="1320" height="44" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="90" y="748" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Optional scheduled path:</tspan> Fabric Pipeline / Notebook → managed identity → same agent → results appear in run history
  </text>

  <!-- ════════════════ CONNECTORS ════════════════ -->

  <!-- user → SPA -->
  <line x1="260" y1="180" x2="336" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
  <!-- SPA → Entra -->
  <line x1="720" y1="180" x2="796" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
  <!-- SPA → secrets -->
  <line x1="1020" y1="180" x2="1096" y2="180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <!-- SPA → Rayfin -->
  <path d="M530 220 L530 270 Q530 280 520 280 L170 280 Q160 280 160 290 L160 306" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#ahG)"/>
  <!-- Rayfin → SQL -->
  <line x1="260" y1="360" x2="336" y2="360" stroke="#10b981" stroke-width="2" marker-end="url(#ahG)"/>
  <!-- SQL → orchestration -->
  <line x1="720" y1="360" x2="796" y2="360" stroke="#10b981" stroke-width="2" marker-end="url(#ahG)"/>
  <!-- orchestration → reporting -->
  <line x1="1020" y1="360" x2="1096" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>

  <!-- orchestration → agent (the key call) -->
  <path d="M910 410 L910 440 Q910 450 900 450 L200 450 Q190 450 190 460 L190 476" stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#ahB)"/>
  <!-- agent → toolbox -->
  <line x1="320" y1="530" x2="396" y2="530" stroke="#3b82f6" stroke-width="2" marker-end="url(#ahB)"/>
  <!-- toolbox → playwright -->
  <line x1="700" y1="530" x2="776" y2="530" stroke="#3b82f6" stroke-width="2" marker-end="url(#ahB)"/>
  <!-- playwright → apps -->
  <line x1="1020" y1="530" x2="1096" y2="530" stroke="#e11d48" stroke-width="2" marker-end="url(#ah)"/>

  <!-- results flow back: agent → SQL database -->
  <path d="M190 580 L190 610 Q190 620 200 620 L520 620 Q530 620 530 610 L530 404" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ahG)"/>

  <!-- step labels on key connectors -->
  <rect x="274" y="158" width="20" height="20" rx="10" fill="#3b82f6"/>
  <text x="284" y="173" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">1</text>

  <rect x="875" y="438" width="20" height="20" rx="10" fill="#3b82f6"/>
  <text x="885" y="453" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">2</text>

  <rect x="345" y="518" width="20" height="20" rx="10" fill="#3b82f6"/>
  <text x="355" y="533" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">3</text>

  <rect x="1050" y="518" width="20" height="20" rx="10" fill="#e11d48"/>
  <text x="1060" y="533" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">4</text>

  <rect x="510" y="608" width="20" height="20" rx="10" fill="#10b981"/>
  <text x="520" y="623" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">5</text>

  <!-- step label key -->
  <text x="60" y="790" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#94a3b8">
    ① Analyst opens app  ② Runner calls agent  ③ Agent drives browser via toolbox  ④ Browser hits live apps  ⑤ Results persisted to database
  </text>
</svg>