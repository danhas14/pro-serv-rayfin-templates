<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Regression Test Studio architecture</title>
  <desc id="desc">Architecture diagram for a Fabric App that stores regression tests in Rayfin data tables, invokes a Foundry agent, and runs browser automation against business web applications.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.52" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#eef8f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#172033" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M1,1 L11,6.5 L1,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M1,1 L11,6.5 L1,12 Z" fill="#0f8a63"/>
    </marker>
    <marker id="arrow-amber" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M1,1 L11,6.5 L1,12 Z" fill="#b45309"/>
    </marker>
    <style>
      .title { font: 700 42px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 19px Segoe UI, Arial, sans-serif; fill: #526174; }
      .lane-title { font: 700 18px Segoe UI, Arial, sans-serif; fill: #334155; letter-spacing: .4px; }
      .box-title { font: 700 20px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 15px Segoe UI, Arial, sans-serif; fill: #475569; }
      .small { font: 400 13px Segoe UI, Arial, sans-serif; fill: #64748b; }
      .tag { font: 700 12px Segoe UI, Arial, sans-serif; fill: #334155; }
      .number { font: 700 15px Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .note-title { font: 700 17px Segoe UI, Arial, sans-serif; fill: #78350f; }
      .note-text { font: 400 14px Segoe UI, Arial, sans-serif; fill: #7c2d12; }
      .lane { fill: rgba(255,255,255,.64); stroke: #dbe4ef; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #d6e0ee; stroke-width: 1.4; filter: url(#shadow); }
      .card-blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.6; filter: url(#shadow); }
      .card-green { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1.6; filter: url(#shadow); }
      .card-amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.6; filter: url(#shadow); }
      .card-slate { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.6; filter: url(#shadow); }
      .connector { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .blue { stroke: #2563eb; marker-end: url(#arrow-blue); }
      .green { stroke: #0f8a63; marker-end: url(#arrow-green); }
      .amber { stroke: #b45309; marker-end: url(#arrow-amber); }
      .dash { stroke-dasharray: 9 8; }
      .legend-line { stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="950" fill="url(#bg)"/>

  <text class="title" x="70" y="70">Regression Test Studio architecture</text>
  <text class="subtitle" x="72" y="104">Fabric App front end, Rayfin data store, Foundry test execution agent, and Browser Automation toolbox</text>

  <rect class="lane" x="50" y="145" width="1500" height="170" rx="26"/>
  <text class="lane-title" x="74" y="180">USER EXPERIENCE</text>

  <rect class="lane" x="50" y="350" width="1500" height="205" rx="26"/>
  <text class="lane-title" x="74" y="385">FABRIC APP + RAYFIN BACKEND</text>

  <rect class="lane" x="50" y="590" width="1500" height="210" rx="26"/>
  <text class="lane-title" x="74" y="625">FOUNDRY EXECUTION PLANE</text>

  <rect class="lane" x="50" y="830" width="1500" height="78" rx="26"/>
  <text class="lane-title" x="74" y="865">OPTIONAL SCHEDULING PATH</text>

  <!-- User and app -->
  <rect class="card-blue" x="90" y="205" width="250" height="86" rx="18"/>
  <text class="box-title" x="120" y="238">Business analyst</text>
  <text class="box-text" x="120" y="263">Creates tests, runs suites,</text>
  <text class="box-text" x="120" y="283">reviews evidence</text>

  <rect class="card-blue" x="450" y="188" width="355" height="120" rx="18"/>
  <text class="box-title" x="482" y="225">Regression Test Studio SPA</text>
  <text class="box-text" x="482" y="252">React + Vite hosted as a Fabric App</text>
  <text class="box-text" x="482" y="276">No-code authoring, suite execution,</text>
  <text class="box-text" x="482" y="300">run history, evidence export</text>

  <rect class="card" x="940" y="190" width="245" height="118" rx="18"/>
  <text class="box-title" x="973" y="228">Microsoft Entra ID</text>
  <text class="box-text" x="973" y="255">Fabric SSO + MSAL public client</text>
  <text class="box-text" x="973" y="279">Delegated Azure AI token</text>

  <rect class="card-amber" x="1260" y="190" width="240" height="118" rx="18"/>
  <text class="box-title" x="1292" y="228">Runtime secrets</text>
  <text class="box-text" x="1292" y="255">Entered only at run time</text>
  <text class="box-text" x="1292" y="279">Redacted before persistence</text>

  <!-- Backend -->
  <rect class="card-green" x="90" y="420" width="320" height="106" rx="18"/>
  <text class="box-title" x="122" y="457">Rayfin Data API</text>
  <text class="box-text" x="122" y="484">Authenticated CRUD over app entities</text>
  <text class="box-text" x="122" y="506">Explicit column selects and filters</text>

  <rect class="card-green" x="500" y="397" width="355" height="152" rx="18"/>
  <text class="box-title" x="532" y="434">Fabric SQL database</text>
  <text class="box-text" x="532" y="461">TestApplication, TestCase, TestStep</text>
  <text class="box-text" x="532" y="485">TestAssertion, TestSuite, SuiteMember</text>
  <text class="box-text" x="532" y="509">TestRun, StepResult, AssertionResult</text>
  <text class="small" x="532" y="534">Shared authenticated team access</text>

  <rect class="card-slate" x="950" y="405" width="265" height="136" rx="18"/>
  <text class="box-title" x="982" y="442">Run orchestration</text>
  <text class="box-text" x="982" y="469">Builds schemaVersion 1.0 payload</text>
  <text class="box-text" x="982" y="493">Persists status, observations,</text>
  <text class="box-text" x="982" y="517">assertions and healed locators</text>

  <rect class="card-amber" x="1280" y="420" width="220" height="106" rx="18"/>
  <text class="box-title" x="1310" y="457">CSV export</text>
  <text class="box-text" x="1310" y="484">Failure and exception report</text>
  <text class="box-text" x="1310" y="506">for business review</text>

  <!-- Foundry -->
  <rect class="card-blue" x="95" y="663" width="360" height="112" rx="18"/>
  <text class="box-title" x="127" y="700">Foundry agent</text>
  <text class="box-text" x="127" y="727">regression-test-agent</text>
  <text class="box-text" x="127" y="751">Deterministic execution + locator resolution</text>

  <rect class="card-blue" x="545" y="645" width="355" height="146" rx="18"/>
  <text class="box-title" x="577" y="682">Browser Automation toolbox</text>
  <text class="box-text" x="577" y="709">MCP toolbox endpoint</text>
  <text class="box-text" x="577" y="733">Remote-tool connection with</text>
  <text class="box-text" x="577" y="757">audience https://ai.azure.com</text>
  <text class="small" x="577" y="779">Endpoint pinned to working agent version</text>

  <rect class="card-blue" x="990" y="663" width="260" height="112" rx="18"/>
  <text class="box-title" x="1022" y="700">Playwright workspace</text>
  <text class="box-text" x="1022" y="727">Managed browser sessions</text>
  <text class="box-text" x="1022" y="751">Screenshots and browser evidence</text>

  <rect class="card-slate" x="1325" y="640" width="175" height="158" rx="18"/>
  <text class="box-title" x="1355" y="677">Apps under test</text>
  <text class="box-text" x="1355" y="704">2 internal apps</text>
  <text class="box-text" x="1355" y="728">2 COTS apps</text>
  <text class="box-text" x="1355" y="752">Web + mobile browser</text>
  <text class="box-text" x="1355" y="776">scenarios</text>

  <!-- Scheduling -->
  <rect class="card-slate" x="430" y="844" width="330" height="48" rx="14"/>
  <text class="box-title" x="460" y="874">Optional Fabric Pipeline / Notebook</text>

  <rect class="card-slate" x="870" y="844" width="350" height="48" rx="14"/>
  <text class="box-title" x="900" y="874">Managed identity scheduled runner</text>

  <!-- connectors -->
  <path class="connector blue" d="M340 248 C372 248 407 248 447 248"/>
  <path class="connector blue" d="M805 248 C850 248 891 248 936 248"/>
  <path class="connector amber dash" d="M1185 249 C1208 249 1230 249 1256 249"/>

  <path class="connector green" d="M628 308 C628 348 512 405 414 452"/>
  <path class="connector green" d="M410 472 C438 472 465 472 497 472"/>
  <path class="connector green" d="M855 473 C884 473 913 473 946 473"/>
  <path class="connector green" d="M1215 473 C1236 473 1258 473 1276 473"/>

  <path class="connector blue" d="M1082 541 C990 603 642 619 452 686"/>
  <path class="connector blue" d="M455 719 C483 719 514 719 541 719"/>
  <path class="connector blue" d="M900 719 C930 719 960 719 986 719"/>
  <path class="connector blue" d="M1250 719 C1275 719 1299 719 1321 719"/>

  <path class="connector green dash" d="M1412 640 C1388 560 1220 548 1035 542"/>
  <path class="connector green dash" d="M270 663 C256 615 250 567 250 530"/>

  <path class="connector amber dash" d="M760 868 C794 868 831 868 866 868"/>
  <path class="connector amber dash" d="M1045 844 C1050 750 1040 616 1120 544"/>

  <!-- numbered bubbles -->
  <circle cx="392" cy="248" r="15" fill="#2563eb"/>
  <text class="number" x="388" y="253">1</text>
  <circle cx="935" cy="604" r="15" fill="#2563eb"/>
  <text class="number" x="931" y="609">2</text>
  <circle cx="520" cy="719" r="15" fill="#2563eb"/>
  <text class="number" x="516" y="724">3</text>
  <circle cx="1276" cy="719" r="15" fill="#2563eb"/>
  <text class="number" x="1272" y="724">4</text>
  <circle cx="256" cy="584" r="15" fill="#0f8a63"/>
  <text class="number" x="252" y="589">5</text>

  <!-- explanatory note -->
  <rect x="930" y="42" width="585" height="86" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text class="note-title" x="958" y="74">Security posture</text>
  <text class="note-text" x="958" y="99">Secrets are entered only at run time, passed to the agent, then redacted before storage.</text>
  <text class="note-text" x="958" y="119">Browser execution uses delegated Azure AI identity; no Fabric Function proxy is used today.</text>

  <!-- legend -->
  <rect x="70" y="42" width="565" height="86" rx="18" fill="#ffffff" stroke="#d6e0ee" stroke-width="1.2"/>
  <line class="legend-line" x1="98" y1="75" x2="154" y2="75" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <text class="small" x="170" y="80">User / agent execution flow</text>
  <line class="legend-line" x1="98" y1="106" x2="154" y2="106" stroke="#0f8a63" stroke-dasharray="9 8" marker-end="url(#arrow-green)"/>
  <text class="small" x="170" y="111">Data persistence / result flow</text>
  <line class="legend-line" x1="380" y1="75" x2="436" y2="75" stroke="#b45309" stroke-dasharray="9 8" marker-end="url(#arrow-amber)"/>
  <text class="small" x="452" y="80">Optional scheduled path</text>
  <text class="small" x="380" y="111">Numbers indicate the normal manual run sequence</text>
</svg>