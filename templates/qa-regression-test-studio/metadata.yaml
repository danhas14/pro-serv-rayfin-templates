name: qa-regression-test-studio
description: >-
  No-code regression testing for web applications. Business analysts author
  tests as plain-language steps; runs execute either through a Foundry browser
  automation agent or a Container App running Playwright, with per-step
  screenshots captured to OneLake as evidence. Includes cron scheduling,
  AI-generated plain-language failure explanations, and Key Vault backed
  credentials for sites that require a sign-in.
